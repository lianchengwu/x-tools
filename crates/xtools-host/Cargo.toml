[package]
name = "xtools-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "All-in-One unified Host and Runner for xtools WASM plugins"
[[bin]]
name = "xtools"
path = "src/main.rs"

[dependencies]
xtools-protocol = { workspace = true }
xtools-runtime = { workspace = true }
xtools-ui = { workspace = true }
wasmtime = { workspace = true }
slint = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
usvg = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
dirs = "6.0"

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(unix)'.dependencies]
gtk4 = { version = "0.11.4", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
