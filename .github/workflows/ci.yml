name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    name: Check & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libfontconfig1-dev \
            libwayland-dev \
            wayland-protocols \
            gobject-introspection \
            valac \
            meson \
            ninja-build \
            xvfb \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dvapi=false \
            -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..
          rm -rf gtk4-layer-shell

      - name: Check Workspace
        run: cargo check --workspace

      - name: Build WASM Plugins
        run: >
          cargo build --target wasm32-unknown-unknown --release
          -p xtools-plugin-time
          -p xtools-plugin-json
          -p xtools-plugin-trans
          -p xtools-plugin-ai
          -p xtools-plugin-codec

      - name: Test xtools-protocol
        run: cargo test -p xtools-protocol

      - name: Test xtools-sdk
        run: cargo test -p xtools-sdk

      - name: Test xtools-ui
        run: cargo test -p xtools-ui

      - name: Test xtools-runtime
        run: cargo test -p xtools-runtime

      - name: Test xtools-host
        run: xvfb-run --auto-servernum cargo test -p xtools-wasm

      - name: Test Plugins
        run: >
          cargo test --no-fail-fast
          -p xtools-plugin-time
          -p xtools-plugin-json
          -p xtools-plugin-trans
          -p xtools-plugin-ai
          -p xtools-plugin-codec

      - name: Smoke Test Plugin Discovery
        run: |
          cargo build
          ./target/debug/xtools list
          ./target/debug/xtools list | grep -q "xtools.time"

  windows:
    name: Test & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build WASM Plugins
        run: >
          cargo build --target wasm32-unknown-unknown --release
          -p xtools-plugin-time
          -p xtools-plugin-json
          -p xtools-plugin-trans
          -p xtools-plugin-ai
          -p xtools-plugin-codec

      - name: Test xtools-protocol / sdk / ui
        run: >
          cargo test --no-fail-fast
          -p xtools-protocol -p xtools-sdk -p xtools-ui

      - name: Test xtools-runtime
        shell: pwsh
        run: |
          cargo test -p xtools-runtime --no-fail-fast 2>&1 | Tee-Object -FilePath runtime-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path runtime-test.log -Pattern 'error\[|error:|panicked at|test .* FAILED|^failures:' |
              Select-Object -First 8 | ForEach-Object { "::error::$($_.Line)" }
            exit $code
          }

      - name: Test xtools-host
        shell: pwsh
        run: |
          cargo test -p xtools-wasm --no-fail-fast 2>&1 | Tee-Object -FilePath host-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path host-test.log -Pattern 'error\[|error:|panicked at|test .* FAILED|^failures:' |
              Select-Object -First 8 | ForEach-Object { "::error::$($_.Line)" }
            exit $code
          }

      - name: Test Plugins
        run: >
          cargo test --no-fail-fast
          -p xtools-plugin-time -p xtools-plugin-json
          -p xtools-plugin-trans -p xtools-plugin-ai
          -p xtools-plugin-codec

      - name: Build All Binaries
        run: cargo build --workspace --release

      - name: Assemble Portable Dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release/plugins | Out-Null
          Copy-Item target/wasm32-unknown-unknown/release/xtools_plugin_time.wasm  target/release/plugins/time.wasm
          Copy-Item target/wasm32-unknown-unknown/release/xtools_plugin_json.wasm  target/release/plugins/json.wasm
          Copy-Item target/wasm32-unknown-unknown/release/xtools_plugin_trans.wasm target/release/plugins/trans.wasm
          Copy-Item target/wasm32-unknown-unknown/release/xtools_plugin_ai.wasm    target/release/plugins/ai.wasm
          Copy-Item target/wasm32-unknown-unknown/release/xtools_plugin_codec.wasm target/release/plugins/codec.wasm

      - name: Smoke Test Windows Singleton (Host Orb & Tray)
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
        run: ./scripts/windows-singleton-smoke.ps1 -TargetDir target/release

      - name: Smoke Test CLI
        shell: pwsh
        run: ./target/release/xtools.exe --help
